# Download portal (media VM): AriaNg web UI on /, aria2 JSON-RPC on /jsonrpc, archive.org helper on /ia/. Tinyauth in front.
server {
    listen 80;
    listen [::]:80;
    server_name downloads.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name downloads.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/downloads.kebin.dev.access.log;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.30:6880;
        include snippets/proxy.conf;
    }

    # aria2 RPC (HTTP and WebSocket), only reachable with a login cookie; the RPC secret is still required.
    location = /jsonrpc {
        proxy_pass http://10.0.10.30:6800/jsonrpc;
        include snippets/proxy.conf;
    }

    location /ia/ {
        proxy_pass http://10.0.10.30:8097/ia/;
        include snippets/proxy.conf;
    }
}
