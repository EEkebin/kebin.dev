# Humanizer page (ai VM :8095): paste a draft, the humanizer model rewrites it. Tinyauth in front.
server {
    listen 80;
    listen [::]:80;
    server_name humanize.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name humanize.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/humanize.kebin.dev.access.log;
    client_max_body_size 1m;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.100:8095;
        include snippets/proxy.conf;
    }
}
