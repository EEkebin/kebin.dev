# OpenAI/Anthropic-compatible model API (llama-swap on the ai VM), protected by a bearer API key.
# The key lives in /etc/nginx/secrets/ai-auth.conf (not in the repo):  map $http_authorization $ai_key_ok { default 0; "Bearer <key>" 1; }
include /etc/nginx/secrets/ai-auth.conf;

server {
    listen 80;
    listen [::]:80;
    server_name ai.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name ai.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;

    access_log /var/log/nginx/ai.kebin.dev.access.log;
    client_max_body_size 50M;

    location = / {
        default_type text/plain;
        return 200 "kebin.dev model API. Use it with the OpenCode CLI: https://kebin.dev/cli/\n";
    }

    location / {
        if ($ai_key_ok = 0) { return 401 '{"error":"missing or invalid API key"}'; }
        proxy_pass http://10.0.10.100:8080;
        include snippets/proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
