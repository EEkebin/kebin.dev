# Model API + llama-swap dashboard (ai VM :8080).
#   /v1/            OpenAI/Anthropic-compatible API: bearer key only, 401 without it (OpenCode, curl).
#   everything else llama-swap's own pages (/ui/ dashboard, /running, /logs, /api/...): bearer key OR a Tinyauth login.
# The key is not in the repo. /etc/nginx/secrets/ai-key-map.conf (included from 00-map.conf) defines $ai_key_ok:
#   map $http_authorization $ai_key_ok { default 0; "Bearer <key>" 1; }

server {
    listen 80;
    listen [::]:80;
    server_name ai.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name ai.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/ai.kebin.dev.access.log;
    client_max_body_size 50M;

    location = / { return 302 /ui/; }

    location /v1/ {
        if ($ai_key_ok = 0) { return 401; }
        proxy_pass http://10.0.10.100:8080;
        include snippets/proxy.conf;
    }

    location / {
        auth_request /tinyauth-or-key;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        proxy_pass http://10.0.10.100:8080;
        include snippets/proxy.conf;
    }

    # passes when the bearer key is present, otherwise asks Tinyauth about the session cookie
    location = /tinyauth-or-key {
        internal;
        if ($ai_key_ok) { return 204; }
        proxy_pass http://10.0.10.100:3000/api/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
}
