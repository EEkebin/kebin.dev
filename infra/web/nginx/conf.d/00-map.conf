# long map keys (the bearer token below) need a bigger bucket than the default 64
map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# $ai_key_ok = 1 when the request carries the ai.kebin.dev bearer key (file is not in the repo):
#   map $http_authorization $ai_key_ok { default 0; "Bearer <key>" 1; }
include /etc/nginx/secrets/ai-key-map.conf;

# qBittorrent's CSRF check rejects a request whose Referer is another origin (e.g. the kebin.dev card that linked to it,
# or the Tinyauth login page) with a bare "Unauthorized". Only pass the Referer through when it is qBittorrent's own.
map $http_referer $qb_referer {
    default "";
    ~^https://qbittorrent\.kebin\.dev/ $http_referer;
}
