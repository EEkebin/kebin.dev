# HLS streams for VRChat video players (jellyfin-vrc-stream on the media VM).
# Public part (/, /vod.m3u8, segments) is deliberately NOT behind Tinyauth: players fetch anonymously, access is by share token.
# /admin/ is a small link-management page behind Tinyauth; nginx injects the proxy admin key from /etc/nginx/secrets/vrc-key.conf:
#   proxy_set_header X-Admin-Key "<key>";  proxy_set_header Authorization 'MediaBrowser Token="<key>"';
server {
    listen 80;
    listen [::]:80;
    server_name vr.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name vr.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;

    access_log /var/log/nginx/vr.kebin.dev.access.log;

    # --- Tinyauth subrequest target (only used by the /admin locations) ---
    location = /tinyauth {
        internal;
        proxy_pass http://10.0.10.100:3000/api/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # --- admin page ---
    location = /admin { return 301 /admin/; }
    location /admin/ {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        alias /var/www/kebin.dev/vr-admin/;
        index index.html;
    }
    location = /admin/api/shares {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        include /etc/nginx/secrets/vrc-key.conf;
        proxy_pass http://10.0.10.30:8000/shares;
    }
    location ~ ^/admin/api/share/([A-Za-z0-9_-]+)$ {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        include /etc/nginx/secrets/vrc-key.conf;
        proxy_pass http://10.0.10.30:8000/share/$1;
    }
    location ~ ^/admin/api/thumbnail/([A-Za-z0-9]+)$ {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        include /etc/nginx/secrets/vrc-key.conf;
        proxy_pass http://10.0.10.30:8000/thumbnail/$1;
    }
    location = /admin/api/items {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        include /etc/nginx/secrets/vrc-key.conf;
        proxy_pass http://10.0.10.30:8096/Items$is_args$args;
    }

    # --- public streaming ---
    location / {
        proxy_pass http://10.0.10.30:8000;
        include snippets/proxy.conf;
    }
}
