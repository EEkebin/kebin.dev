# ScopeSentry attack-surface management (ai VM 10.0.10.100:8082, autumn27/scopesentry).
# Tinyauth in front, ScopeSentry's own login behind it. Feeds ARTEX's Asset Sync + MCP row.
server {
    listen 80;
    listen [::]:80;
    server_name scope.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name scope.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/scope.kebin.dev.access.log;
    client_max_body_size 64m;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.100:8082;
        include snippets/proxy.conf;
    }
}
