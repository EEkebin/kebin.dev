# share.kebin.dev: send files between browsers (kebin-share.service on this VM, 127.0.0.1:8766). Public on purpose:
# files go between the two people using it, browser to browser, or streamed through without being stored.
limit_req_zone $binary_remote_addr zone=share_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name share.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name share.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/share.kebin.dev.access.log;

    location / {
        proxy_pass http://127.0.0.1:8766;
        include snippets/proxy.conf;
    }
    location ~ ^/api/(join|signal|rename)$ {
        limit_req zone=share_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8766;
        include snippets/proxy.conf;
    }
    location = /api/events {
        proxy_pass http://127.0.0.1:8766;
        include snippets/proxy.conf;
        proxy_read_timeout 1h;
    }
    location /api/relay/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8766;
        include snippets/proxy.conf;
    }
}
