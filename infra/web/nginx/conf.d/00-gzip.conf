# Compression for every host. Brotli/zstd are not in the nginx.org build; gzip is what browsers negotiate here.
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
           image/svg+xml application/xml text/xml application/vnd.apple.mpegurl font/ttf font/otf;
# serve pre-compressed .gz files (built by deploy.sh) instead of compressing on every request
gzip_static on;
