# SillyTavern (ai VM :8010): roleplay and story front end for the models in llama-swap. Tinyauth in front.
server {
    listen 80;
    listen [::]:80;
    server_name tavern.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name tavern.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/tavern.kebin.dev.access.log;
    client_max_body_size 100m;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.100:8010;
        include snippets/proxy.conf;
        # replies stream from a long-lived request, which stalled over HTTP/3 on share.kebin.dev
        include snippets/no-h3.conf;
    }
}
