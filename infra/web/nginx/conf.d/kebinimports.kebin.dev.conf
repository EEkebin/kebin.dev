# kebinImports project page. Static files from site/kebinimports/ (deployed to /var/www/kebin.dev/kebinimports);
# the shared stylesheet comes from the main webroot. Screenshots go in site/kebinimports/shots/.
server {
    listen 80;
    listen [::]:80;
    server_name kebinimports.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name kebinimports.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    root /var/www/kebin.dev/kebinimports;
    index index.html;
    access_log /var/log/nginx/kebinimports.kebin.dev.access.log;

    location = /style.css {
        root /var/www/kebin.dev;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
    location ~* \.(png|jpg|webp|avif|svg|js|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
