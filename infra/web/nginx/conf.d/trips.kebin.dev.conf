server {
    listen 80;
    listen [::]:80;
    server_name trips.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name trips.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    root /var/www/kebin.dev/trips;
    index index.html;
    access_log /var/log/nginx/trips.kebin.dev.access.log;

    location / { try_files $uri $uri/ =404; }
}

