# ARTEX autonomous pentest (ai VM 127.0.0.1:8787, BaaRai/ARTEX v0.7.0). Tinyauth in front, ARTEX admin login behind it.
# SSE (activity stream) needs the proxy.conf settings: buffering off, long timeouts, HTTP/1.1.
# ARTEX_TRUSTED_PROXIES=10.0.10.20/32 is set in the service unit so per-IP login rate limits and HSTS work behind nginx.
server {
    listen 80;
    listen [::]:80;
    server_name artex.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name artex.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/artex.kebin.dev.access.log;
    # 512 MiB combined chat-attachment limit + ~1 MiB multipart metadata.
    client_max_body_size 513m;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.100:8787;
        include snippets/proxy.conf;
    }
}
