limit_req_zone $binary_remote_addr zone=status:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kebin.dev www.kebin.dev;
    return 301 https://kebin.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name www.kebin.dev;
    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    return 301 https://kebin.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    root /var/www/kebin.dev;
    index index.html;
    access_log /var/log/nginx/kebin.dev.access.log;

    location /api/status {
        limit_req zone=status burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/ { return 404; }

    # CLI page: portal login required; the API key is substituted into the page by nginx from a secrets file
    # (/etc/nginx/secrets/ai-key-subfilter.conf:  sub_filter "__AIBOX_KEY__" "<key>";  sub_filter_once off;  sub_filter_types text/html;)
    location = /cli { return 301 /cli/; }
    location ~ ^/cli/(index\.html)?$ {
        auth_request /tinyauth;
        auth_request_set $tinyauth_location $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $tinyauth_location;
        gzip_static off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        include /etc/nginx/secrets/ai-key-subfilter.conf;
        try_files /cli/index.html =404;
    }
    location = /tinyauth {
        internal;
        proxy_pass http://10.0.10.100:3000/api/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # the scripts themselves stay public (no secrets inside) so curl/irm can fetch them
    location ~* /cli/.*\.(sh|ps1)$ {
        types {}
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|webp|avif|svg|css|js|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
