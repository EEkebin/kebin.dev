limit_req_zone $binary_remote_addr zone=status:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kebin.dev www.kebin.dev;
    return 301 https://kebin.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name www.kebin.dev;
    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    return 301 https://kebin.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    root /var/www/kebin.dev;
    index index.html;
    access_log /var/log/nginx/kebin.dev.access.log;

    location /api/status {
        limit_req zone=status burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/ { return 404; }

    location ~* /cli/.*\.(sh|ps1)$ {
        types {}
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|webp|avif|svg|css|js|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
