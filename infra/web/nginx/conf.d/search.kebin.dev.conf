# SearXNG (ai VM). Two doors on one host:
#   /            SearXNG's own search page, behind a Tinyauth login (browser use)
#   /mcp /health mcp-searxng (:8899) for OpenCode on remote machines, bearer key only (same key as ai.kebin.dev;
#                $ai_key_ok comes from /etc/nginx/secrets/ai-key-map.conf, see 00-map.conf)
# OpenCode config: {"type":"remote","url":"https://search.kebin.dev/mcp","headers":{"Authorization":"Bearer <key>"}}

server {
    listen 80;
    listen [::]:80;
    server_name search.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name search.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/search.kebin.dev.access.log;
    client_max_body_size 1M;
    include snippets/tinyauth.conf;

    location / {
        proxy_pass http://10.0.10.100:8888;
        include snippets/proxy.conf;
    }

    # API paths answer a plain 401 without the key (the server-level error_page would otherwise send API clients to the login page)
    location @nokey { return 401 "unauthorized
"; }
    location /mcp {
        auth_request off;
        error_page 401 @nokey;
        if ($ai_key_ok = 0) { return 401; }
        proxy_pass http://10.0.10.100:8899;
        include snippets/proxy.conf;
    }
    location = /health {
        auth_request off;
        error_page 401 @nokey;
        if ($ai_key_ok = 0) { return 401; }
        proxy_pass http://10.0.10.100:8899;
        include snippets/proxy.conf;
    }
}
