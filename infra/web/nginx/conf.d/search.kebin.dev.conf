# Web search MCP for OpenCode on remote machines (mcp-searxng on the ai VM, streamable HTTP).
# Same bearer key as ai.kebin.dev; the check lives in /etc/nginx/secrets/ai-auth.conf (not in the repo).
# Clients use: {"type":"remote","url":"https://search.kebin.dev/mcp","headers":{"Authorization":"Bearer <key>"}}

server {
    listen 80;
    listen [::]:80;
    server_name search.kebin.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name search.kebin.dev;

    ssl_certificate     /etc/nginx/ssl/kebin.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kebin.dev/privkey.pem;
    include snippets/tls.conf;
    include snippets/noindex.conf;

    access_log /var/log/nginx/search.kebin.dev.access.log;
    client_max_body_size 1M;

    location = / {
        default_type text/plain;
        return 200 "kebin.dev search MCP. Configured for you by the OpenCode installer: https://kebin.dev/cli/\n";
    }

    location / {
        include /etc/nginx/secrets/ai-auth.conf;
        proxy_pass http://10.0.10.100:8899;
        include snippets/proxy.conf;
    }
}
