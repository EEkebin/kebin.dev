# For hosts whose long-lived or streaming requests misbehave over HTTP/3 (share.kebin.dev: the relay upload was cut off
# and the event stream stalled over QUIC, while HTTP/2 worked; 2026-10-09). Tells browsers to forget h3 for this host.
# An add_header inside a location replaces the server-level ones, so the headers from tls.conf and noindex.conf are repeated.
add_header Alt-Svc 'clear' always;
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
