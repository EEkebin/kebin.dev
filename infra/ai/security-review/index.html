<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Review · kebin</title><link rel="stylesheet" href="/style.css">
<style>form{display:grid;gap:1rem;justify-items:start}button{padding:.6rem 1rem;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.55}</style></head>
<body class="page"><main class="wrap"><a class="back" href="/ai/">← AI</a>
<h1>Security Review</h1><p class="lead">Upload a Trivy JSON report. Qwen reviews the highest-severity package findings and suggests fixes.</p>
<form><label for="file">Container scan report (JSON, up to 8 MiB)</label><input required id="file" type="file" accept=".json,application/json">
<button>Review report</button></form><pre role="status" aria-live="polite"></pre></main>
<script>
const form = document.querySelector('form'), output = document.querySelector('pre');
form.onsubmit = async event => {
  event.preventDefault();
  const file = document.querySelector('#file').files[0];
  if (file.size > 8388608) { output.textContent = 'Choose a report under 8 MiB.'; return; }
  const button = form.querySelector('button');
  button.disabled = true; output.textContent = 'Reviewing report with Qwen…';
  try {
    const response = await fetch('review', {method:'POST', headers:{'Content-Type':'application/json'}, body:file, redirect:'error'});
    output.textContent = response.headers.get('content-type')?.startsWith('text/plain') ? await response.text() : 'Request failed (' + response.status + '). Reload the page and try again.';
  } catch { output.textContent = 'Could not reach Security Review. Reload to check your login.'; }
  finally { button.disabled = false; }
};
</script></body></html>
