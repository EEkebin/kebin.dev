<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kebin</title>
  <meta name="description" content="kebin's corner of the internet. Media, AI and the machines behind them.">
  <meta name="author" content="kebin">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd23f">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="kebin.dev">
  <meta property="og:url" content="https://kebin.dev/">
  <meta property="og:title" content="kebin.dev">
  <meta property="og:description" content="kebin's corner of the internet. Media, AI and the machines behind them.">
  <meta property="og:image" content="https://kebin.dev/images/banner.png">
  <meta property="og:image:secure_url" content="https://kebin.dev/images/banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="kebin's minion next to the words kebin.dev">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="kebin.dev">
  <meta name="twitter:description" content="kebin's corner of the internet. Media, AI and the machines behind them.">
  <meta name="twitter:image" content="https://kebin.dev/images/banner.png">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <div class="avatar-ring">
        <picture>
          <source srcset="/images/avatar.webp" type="image/webp">
          <img class="avatar" src="/images/avatar.png" alt="kebin's minion avatar" width="242" height="360" fetchpriority="high">
        </picture>
      </div>
      <h1>kebin</h1>
    </header>

    <nav class="groups" aria-label="Sections">
      <a class="gcard" href="/media/">
        <svg class="gicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18M8 5v4M16 5v4M10 12.5v4l3.5-2z"/></svg>
        <span class="gname">Media</span>
        <span class="gdesc">Stream, Seerr, Music, Files, Cloud, VR and the arr stack</span>
        <span class="status" hx-get="/api/status?group=media-all" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
      </a>
      <a class="gcard" href="/ai/">
        <svg class="gicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8zM5 16l.6 1.4 1.4.6-1.4.6L5 20l-.6-1.4L3 18l1.4-.6z"/></svg>
        <span class="gname">AI</span>
        <span class="gdesc">Code, Comfy, Search, Models and the CLI installer</span>
        <span class="status" hx-get="/api/status?group=ai" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
      </a>
      <a class="gcard" href="/system/">
        <svg class="gicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></svg>
        <span class="gname">System</span>
        <span class="gdesc">Proxmox and the portal login</span>
        <span class="status" hx-get="/api/status?group=system" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
      </a>
    </nav>

    <footer>
      <span>© <span id="y">2026</span> kebin</span>
    </footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
