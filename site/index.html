<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kebin</title>
  <meta name="description" content="kebin.dev">
  <meta name="author" content="kebin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kebin.dev/">
  <meta property="og:title" content="kebin">
  <meta property="og:description" content="kebin.dev">
  <meta property="og:image" content="https://kebin.dev/images/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="kebin">
  <meta name="twitter:description" content="kebin.dev">
  <meta name="twitter:image" content="https://kebin.dev/images/banner.png">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <div class="avatar-ring">
        <img class="avatar" src="/images/avatar.png" alt="kebin's minion avatar" width="242" height="360">
      </div>
      <h1>kebin</h1>
    </header>

    <section class="apps" aria-label="Apps">
      <div class="grid">
        <a class="card" href="https://stream.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/stream.png" alt="" width="40" height="40">
          <span class="name">Stream</span>
          <span class="status" hx-get="/api/status?svc=stream" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://seerr.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/seerr.svg" alt="" width="40" height="40">
          <span class="name">Seerr</span>
          <span class="status" hx-get="/api/status?svc=seerr" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://music.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/music.png" alt="" width="40" height="40">
          <span class="name">Music</span>
          <span class="status" hx-get="/api/status?svc=music" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://files.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/files.svg" alt="" width="40" height="40">
          <span class="name">Files</span>
          <span class="status" hx-get="/api/status?svc=files" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://cloud.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/cloud.png" alt="" width="40" height="40">
          <span class="name">Cloud</span>
          <span class="status" hx-get="/api/status?svc=cloud" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://code.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/code.svg" alt="" width="40" height="40">
          <span class="name">Code</span>
          <span class="status" hx-get="/api/status?svc=code" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://comfy.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/comfy.svg" alt="" width="40" height="40">
          <span class="name">Comfy</span>
          <span class="status" hx-get="/api/status?svc=comfy" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://pve.kebin.dev" target="_blank" rel="noopener">
          <img class="logo" src="/images/apps/pve.png" alt="" width="40" height="40">
          <span class="name">Proxmox</span>
          <span class="status" hx-get="/api/status?svc=pve" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
      </div>
    </section>

    <footer>
      <span>© <span id="y">2026</span> kebin</span>
    </footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
