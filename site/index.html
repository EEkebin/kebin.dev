<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kebin</title>
  <meta name="description" content="kebin.dev">
  <meta name="author" content="kebin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kebin.dev/">
  <meta property="og:title" content="kebin">
  <meta property="og:description" content="kebin.dev">
  <meta property="og:image" content="https://kebin.dev/images/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="kebin">
  <meta name="twitter:description" content="kebin.dev">
  <meta name="twitter:image" content="https://kebin.dev/images/banner.png">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <div class="avatar-ring">
        <img class="avatar" src="/images/avatar.png" alt="kebin's minion avatar" width="242" height="360">
      </div>
      <h1>kebin</h1>
    </header>

    <section class="apps" aria-label="Apps">
      <div class="grid">
        <a class="card" href="https://stream.kebin.dev" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg></span>
          <span class="name">Stream</span>
          <span class="status" hx-get="/api/status?svc=stream" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://seerr.kebin.dev" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5"/></svg></span>
          <span class="name">Seerr</span>
          <span class="status" hx-get="/api/status?svc=seerr" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://music.kebin.dev" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
          <span class="name">Music</span>
          <span class="status" hx-get="/api/status?svc=music" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://files.kebin.dev" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-2H5a2 2 0 0 0-2 2z"/></svg></span>
          <span class="name">Files</span>
          <span class="status" hx-get="/api/status?svc=files" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
        <a class="card" href="https://cloud.kebin.dev" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 9.3 4.5 4.5 0 0 0 7 18z"/></svg></span>
          <span class="name">Cloud</span>
          <span class="status" hx-get="/api/status?svc=cloud" hx-trigger="load, every 60s" hx-swap="innerHTML"><span class="dot"></span>checking</span>
        </a>
      </div>
    </section>

    <footer>
      <span>© <span id="y">2026</span> kebin</span>
    </footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
