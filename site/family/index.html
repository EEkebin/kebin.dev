<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family dashboard · kebin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .clock { margin: 1.5rem 0; padding: 2rem; color: #302714; background: #ffe39b; border-radius: 1rem; }
    .clock p { margin: 0; }
    #time { font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1.2; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="page">
  <main class="wrap">
    <a class="back" href="/">← kebin.dev</a>
    <h1>hi mom and dad</h1>
    <section class="clock" aria-label="Your local date and time" hidden>
      <p id="date"></p>
      <p id="time"></p>
    </section>
    <nav aria-label="Movie night">
      <a class="btn pcard" href="https://stream.kebin.dev/">Watch a movie <span class="parrow" aria-hidden="true">→</span></a>
      <a class="btn pcard" href="https://seerr.kebin.dev/">Request a movie or show <span class="parrow" aria-hidden="true">→</span></a>
    </nav>
  </main>
  <script>
    const dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'full' });
    const timeFormat = new Intl.DateTimeFormat(undefined, { timeStyle: 'short' });
    function refreshClock() {
      const now = new Date();
      document.getElementById('date').textContent = dateFormat.format(now);
      document.getElementById('time').textContent = timeFormat.format(now);
    }
    refreshClock();
    document.querySelector('.clock').hidden = false;
    setInterval(refreshClock, 10000);
  </script>
</body>
</html>
