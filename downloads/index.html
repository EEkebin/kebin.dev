<!DOCTYPE html>
<html lang="en">
<!-- Execute js script -->

<body>
    <script>
        var xhr = new XMLHttpRequest();
        xhr.addEventListener('load', function () {
            var releases = JSON.parse(this.responseText);
            var count = 0;
            for (var i = 0; i < releases.length; ++i) {
                for (var j = 0; j < releases[i].assets.length; ++j) {
                    count += releases[i].assets[j].download_count;
                }
            }
            document.getElementById('downloads').innerHTML = count;
        });
        xhr.open('GET', 'https://api.github.com/repos/EEkebin/kebinImports/releases');
        xhr.send();
    </script>
    <p id="downloads"></p>
</body>

</html>
